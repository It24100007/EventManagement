# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=eventDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa2
spring.datasource.password=123

# Application
spring.application.name=EventManagement

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration (JSON Date Formatting)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.example.demo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE