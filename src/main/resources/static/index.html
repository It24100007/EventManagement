<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventEase - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="brand">
      <div class="logo-circle">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <path d="M20 5L35 15V25L20 35L5 25V15L20 5Z" fill="url(#gradient)" stroke="white" stroke-width="2"/>
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea"/>
              <stop offset="100%" style="stop-color:#764ba2"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>EventEase</h1>
      <p class="tagline">Modern Event Management</p>
    </div>

    <div class="role-switcher">
      <button class="role-btn active" data-role="customer" onclick="switchRole('customer')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Customer</span>
      </button>
      <button class="role-btn" data-role="manager" onclick="switchRole('manager')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 3v18M9 12h12"/>
        </svg>
        <span>Finance Manager</span>
      </button>
    </div>

    <form id="loginForm" class="login-form">
      <div class="input-group">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <input type="email" id="email" placeholder="Email address" required>
      </div>

      <div class="input-group">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <div id="errorMessage" class="error-toast"></div>

      <button type="submit" class="submit-btn">
        <span>Sign In</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>




  </div>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
